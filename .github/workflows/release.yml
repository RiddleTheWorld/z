name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Path latest.zip -DestinationPath "C:\Dalamud" -Force
          Get-ChildItem -Path "C:\Dalamud" -Recurse -Depth 2 | Select-Object FullName

      - name: Find Dalamud path
        id: dalamud
        run: |
          $dll = Get-ChildItem -Path "C:\Dalamud" -Recurse -Filter "Dalamud.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "Dalamud.dll not found"; exit 1 }
          $path = $dll.DirectoryName
          Write-Output "path=$path" >> $env:GITHUB_OUTPUT
          Write-Output "Found Dalamud at $path"

      - name: Build Release
        run: dotnet build FFXIVRPC.sln -c Release -p:DalamudLibPath="${{ steps.dalamud.outputs.path }}"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path staging/FFXIVRPC/Assets -Force
          Copy-Item FFXIVRPC/bin/x64/Release/FFXIVRPC.dll staging/FFXIVRPC/
          Copy-Item FFXIVRPC/FFXIVRPC.json staging/FFXIVRPC/
          Copy-Item FFXIVRPC/Assets/*.png staging/FFXIVRPC/Assets/
          Compress-Archive -Path staging/FFXIVRPC -DestinationPath FFXIVRPC.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: FFXIVRPC.zip
          generate_release_notes: true
