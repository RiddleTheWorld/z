name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Path latest.zip -DestinationPath "C:\Dalamud"

      - name: Build Release
        run: dotnet build FFXIVRPC.sln -c Release -p:DalamudLibPath="C:\Dalamud\hooks\dev"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path staging/FFXIVRPC/Assets -Force
          Copy-Item FFXIVRPC/bin/Release/FFXIVRPC.dll staging/FFXIVRPC/
          Copy-Item FFXIVRPC/FFXIVRPC.json staging/FFXIVRPC/
          Copy-Item FFXIVRPC/Assets/*.png staging/FFXIVRPC/Assets/
          Compress-Archive -Path staging/FFXIVRPC -DestinationPath FFXIVRPC.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: FFXIVRPC.zip
          generate_release_notes: true
